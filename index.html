<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a4830">
<meta name="description" content="БЛИЖЕ — 50 карточек с вопросами для тёплого разговора.">
<title>БЛИЖЕ — игра для сближения</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
<link rel="preload" href="questions.json" as="fetch" crossorigin>
<link rel="preload" href="back.webp" as="image" type="image/webp">

<style>
  :root{
    /* Цвет сукна. Хочешь красный — поменяй на:
       --felt-1:#7a1f24; --felt-2:#4a0f14; --felt-3:#210509;  */
    --felt-1:#2d6b47;
    --felt-2:#1a4830;
    --felt-3:#0a2113;

    --paper:#ffffff;
    --ink:#111111;
    --radius:18px;
    --shadow:0 22px 44px -14px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:24px max(16px,env(safe-area-inset-left))
            calc(24px + env(safe-area-inset-bottom))
            max(16px,env(safe-area-inset-right));
    background:
      radial-gradient(ellipse at 50% 35%,
        var(--felt-1) 0%,
        var(--felt-2) 55%,
        var(--felt-3) 100%);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff;
    overflow-x:hidden;
    position:relative;
  }
  /* Тканевая текстура */
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.035) 0 2px, transparent 2px 4px);
    pointer-events:none;
    z-index:0;
  }
  /* Виньетка */
  body::after{
    content:"";
    position:fixed;inset:0;
    background:radial-gradient(ellipse at 50% 45%,
      transparent 40%, rgba(0,0,0,.5) 100%);
    pointer-events:none;
    z-index:0;
  }

  /* ------- Стол ------- */
  .table{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:auto auto auto;
    grid-template-areas:"deck card discard";
    align-items:center;
    gap:clamp(16px,4vw,44px);
    width:100%;
    max-width:900px;
    justify-content:center;
  }

  /* ------- Колода ------- */
  .deck{
    grid-area:deck;
    position:relative;
    width:min(22vw, 110px);
    aspect-ratio:2/3;
    padding:0;
    border:none;
    background:transparent;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .deck:hover{transform:translateY(-3px)}
  .deck:active{transform:translateY(0)}
  .deck:focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:8px;border-radius:var(--radius)}
  .deck .layer{
    position:absolute;inset:0;
    border-radius:var(--radius);
    background:url('back.webp') center/cover no-repeat,#efe9dc;
    border:1px solid rgba(0,0,0,.18);
    box-shadow:0 10px 22px -10px rgba(0,0,0,.65);
  }
  .deck .layer:nth-child(1){transform:translate(-4px, 4px)  rotate(-1.2deg)}
  .deck .layer:nth-child(2){transform:translate(-2px, 2px)  rotate(-0.4deg)}
  .deck .layer:nth-child(3){transform:translate(0,    0)    rotate(0.3deg)}

  /* ------- Активная карта ------- */
  .scene{
    grid-area:card;
    width:min(50vw, 300px);
    aspect-ratio:2/3;
    perspective:1600px;
  }
  .card{
    all:unset;
    display:block;
    position:relative;
    width:100%;
    height:100%;
    border-radius:var(--radius);
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .75s cubic-bezier(.175,.885,.32,1.275);
    box-shadow:var(--shadow);
  }
  .card.is-flipped{transform:rotateY(180deg)}
  .card:focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:8px;border-radius:var(--radius)}

  .card-face{
    position:absolute;inset:0;
    border-radius:var(--radius);
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border:1px solid rgba(0,0,0,.18);
  }
  .card-back{
    background:url('back.webp') center/cover no-repeat,#efe9dc;
  }
  .card-front{
    transform:rotateY(180deg);
    background:var(--paper);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:9% 8%;
    text-align:center;
  }
  .question{
    display:block;
    margin:0;
    font-family:'Neucha','Segoe Print','Comic Sans MS',cursive;
    font-weight:400;
    font-size:clamp(20px, 5.2vw, 28px);
    line-height:1.5;
    color:var(--ink);
    text-wrap:balance;
  }

  /* ------- Сброс ------- */
  .discard{
    grid-area:discard;
    position:relative;
    width:min(22vw, 110px);
    aspect-ratio:2/3;
  }
  .discard::after{
    content:"";
    position:absolute;inset:0;
    border-radius:var(--radius);
    border:2px dashed rgba(255,255,255,.14);
    pointer-events:none;
  }
  .discard .layer{
    position:absolute;inset:0;
    border-radius:var(--radius);
    background:var(--paper);
    border:1px solid rgba(0,0,0,.14);
    box-shadow:0 6px 16px -8px rgba(0,0,0,.55);
    transform-origin:center;
    animation:drop .38s ease-out both;
  }
  @keyframes drop{
    from{opacity:0; transform:translateY(-22px) scale(.85) rotate(var(--rot,0deg))}
    to  {opacity:1; transform:translateY(0)     scale(1)   rotate(var(--rot,0deg))}
  }

  /* ------- Мобильная раскладка ------- */
  @media (max-width: 640px){
    .table{
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "deck discard"
        "card card";
      row-gap:22px;
      column-gap:14px;
      justify-items:center;
      max-width:440px;
    }
    .deck, .discard{width:min(26vw, 96px)}
    .scene{width:min(80vw, 320px); margin-top:6px}
  }

  @media (prefers-reduced-motion: reduce){
    .card{transition-duration:.001ms}
    .deck{transition:none}
    .discard .layer{animation-duration:.001ms}
  }
</style>
</head>
<body>

  <div class="table">

    <button class="deck" id="deckBtn" type="button" aria-label="Колода. Тянуть карту">
      <span class="layer" aria-hidden="true"></span>
      <span class="layer" aria-hidden="true"></span>
      <span class="layer" aria-hidden="true"></span>
    </button>

    <div class="scene">
      <button class="card" id="card" type="button" aria-label="Карта. Нажмите, чтобы перевернуть">
        <span class="card-face card-back" aria-hidden="true"></span>
        <span class="card-face card-front">
          <span class="question" id="questionText" aria-live="polite">Тяни карту</span>
        </span>
      </button>
    </div>

    <div class="discard" id="discardPile" aria-hidden="true"></div>

  </div>

<script>
(() => {
  'use strict';

  const card = document.getElementById('card');
  const questionEl = document.getElementById('questionText');
  const deckBtn = document.getElementById('deckBtn');
  const discardPile = document.getElementById('discardPile');

  const FLIP_MS = 750;
  const MAX_DISCARD_LAYERS = 8;

  const state = {
    questions: [],
    deck: [],
    index: 0,
    isFlipped: false,
    isAnimating: false,
    ready: false,
    currentText: ''
  };

  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function resetDeck(){
    state.deck = shuffle(state.questions.slice());
    state.index = 0;
  }
  function sentenceCase(text){
    const t = String(text).trim().toLowerCase();
    return t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
  }
  function lock(ms){
    state.isAnimating = true;
    setTimeout(() => { state.isAnimating = false; }, ms);
  }

  function pushDiscard(){
    const layer = document.createElement('span');
    layer.className = 'layer';
    const rot = (Math.random() * 10 - 5).toFixed(2) + 'deg';
    layer.style.setProperty('--rot', rot);
    discardPile.appendChild(layer);

    const layers = discardPile.querySelectorAll('.layer');
    if (layers.length > MAX_DISCARD_LAYERS){
      layers[0].remove();
    }
  }

  function showQuestion(){
    if (state.index >= state.deck.length) resetDeck();
    const text = sentenceCase(state.deck[state.index++]);

    state.currentText = text;
    questionEl.textContent = text;
    card.classList.add('is-flipped');
    card.setAttribute('aria-label', 'Карта с вопросом. Нажмите, чтобы убрать в сброс');
    state.isFlipped = true;
  }

  function hideQuestion(){
    if (state.currentText){
      pushDiscard();
      state.currentText = '';
    }
    card.classList.remove('is-flipped');
    card.setAttribute('aria-label', 'Карта. Нажмите, чтобы перевернуть');
    state.isFlipped = false;
    // текст оставляем до конца анимации, потом сбрасываем
    setTimeout(() => {
      if (!state.isFlipped) questionEl.textContent = 'Тяни карту';
    }, FLIP_MS / 2);
  }

  function onDraw(){
    if (!state.ready || state.isAnimating) return;
    lock(FLIP_MS);
    state.isFlipped ? hideQuestion() : showQuestion();
  }

  card.addEventListener('click', onDraw);
  deckBtn.addEventListener('click', () => {
    if (!state.ready || state.isFlipped) return;
    onDraw();
  });

  async function init(){
    try {
      const res = await fetch('questions.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data)
        ? data.filter(q => typeof q === 'string' && q.trim().length)
        : [];
      if (!list.length) throw new Error('Пустой список');

      state.questions = list;
      resetDeck();
      state.ready = true;
    } catch (err){
      console.error('Ошибка загрузки:', err);
      questionEl.textContent = 'Не удалось загрузить вопросы';
    }
  }

  init();
})();
</script>
</body>
</html>
