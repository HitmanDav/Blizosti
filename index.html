<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Колода «Близость»</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#1a1a1a;font-family:Arial,sans-serif;padding:20px;gap:40px;overflow:hidden}.scene{width:min(85vw,350px);height:min(127.5vw,525px);perspective:1200px}.card{width:100%;height:100%;position:relative;transition:transform .7s cubic-bezier(.175,.885,.32,1.275);transform-style:preserve-3d;cursor:pointer}.card.is-flipped{transform:rotateY(180deg)}.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}.card-back{background:url('back.png') center/cover no-repeat,#222}.card-front{background:#fff;color:#1a1a1a;transform:rotateY(180deg);font-size:1.3rem;font-weight:600;line-height:1.4;letter-spacing:.5px;text-transform:uppercase}button{background:#ff00aa;color:#fff;border:none;padding:16px 48px;font-size:1.1rem;border-radius:50px;cursor:pointer;font-weight:bold;transition:background .2s,transform .1s;box-shadow:0 8px 20px rgba(255,0,170,.3);z-index:10}button:hover{background:#e60099}button:active{transform:scale(.97)}button:disabled{background:#555;box-shadow:none;cursor:not-allowed}</style></head><body><div class="scene"><div class="card" id="card"><div class="card-face card-back"></div><div class="card-face card-front" id="questionText">Загрузка...</div></div></div><button id="nextBtn" disabled>Загрузка...</button><script>const card=document.getElementById('card');const questionText=document.getElementById('questionText');const nextBtn=document.getElementById('nextBtn');let questions=[];let deck=[];let currentIndex=0;let isFlipped=false;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function resetDeck(){deck=shuffle([...questions]);currentIndex=0;}function nextCard(){if(isFlipped){card.classList.remove('is-flipped');isFlipped=false;nextBtn.textContent='Тянуть карту';return;}if(currentIndex>=deck.length){resetDeck();}questionText.textContent=deck[currentIndex++];card.classList.add('is-flipped');isFlipped=true;nextBtn.textContent='Следующая';}async function init(){try{const response=await fetch('questions.json');if(!response.ok)throw new Error('HTTP '+response.status);questions=await response.json();resetDeck();questionText.textContent='Нажми «Дальше»';nextBtn.disabled=false;nextBtn.textContent='Дальше';}catch(error){console.error('Ошибка загрузки:',error);questionText.textContent='Ошибка загрузки вопросов';nextBtn.textContent='Ошибка';}}nextBtn.addEventListener('click',nextCard);card.addEventListener('click',nextCard);init();</script></body></html>
