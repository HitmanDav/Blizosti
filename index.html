<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e4028">
<meta name="description" content="БЛИЖЕ — игра для сближения.">
<title>БЛИЖЕ — игра для сближения</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">

<link rel="preload" href="questions.json" as="fetch" crossorigin>
<link rel="preload" href="back.webp" as="image" type="image/webp">

<style>
  :root{
    --felt-1:#3a7a4a;
    --felt-2:#1e4028;
    --felt-3:#0a1a10;
    --card-radius:14px;
    --card-shadow:0 10px 22px rgba(0,0,0,.5), 0 2px 5px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    touch-action:manipulation;
    font:16px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff;
    overflow:hidden;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,.03) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.03) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse 130% 90% at 50% 45%, var(--felt-1) 0%, var(--felt-2) 55%, var(--felt-3) 100%);
    background-attachment:fixed;
  }
  body::after{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse 100% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%);
  }

  .table{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(24px, 7vw, 56px);
    padding:20px;
  }

  .pile{
    position:relative;
    width:min(38vw, 155px);
    aspect-ratio:2/3;
  }

  /* ---------- Колода ---------- */
  .deck{
    all:unset;
    display:block;
    position:relative;
    width:100%;
    height:100%;
    cursor:pointer;
    border-radius:var(--card-radius);
    transition:transform .18s ease;
  }
  .deck:hover{transform:translateY(-2px)}
  .deck:active{transform:translateY(0) scale(.985)}
  .deck:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:var(--card-radius)}

  .deck-card{
    position:absolute;
    inset:0;
    z-index:calc(var(--i) * -1);
    border-radius:var(--card-radius);
    background:url('back.webp') center/cover no-repeat, #f4f1ea;
    box-shadow:var(--card-shadow);
    transform:translate(calc(var(--i) * 1.2px), calc(var(--i) * -1.6px));
  }

  /* ---------- Сброс ---------- */
  .discard{
    position:relative;
    width:100%;
    height:100%;
    cursor:pointer;
  }
  .discard:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:var(--card-radius)}

  .discard-slot{
    position:absolute;inset:0;
    border-radius:var(--card-radius);
    border:2px dashed rgba(255,255,255,.22);
    background:rgba(0,0,0,.14);
    transition:opacity .3s;
  }

  .discard-edge{
    position:absolute;inset:0;
    z-index:calc(10 + var(--i));
    border-radius:var(--card-radius);
    background:#ece6d8;
    box-shadow:0 2px 5px rgba(0,0,0,.35);
    transform:translate(calc(var(--i) * -2px), calc(var(--i) * 2px));
    opacity:0;
    transition:opacity .4s ease;
  }

  .current{
    position:absolute;inset:0;
    z-index:20;
    border-radius:var(--card-radius);
    background:#fff;                     /* чисто белый, без градиентов */
    box-shadow:var(--card-shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14% 11%;
    text-align:center;
    opacity:0;
    transform:scale(.9) rotate(-3deg);
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .current.is-visible{opacity:1}

  .current.is-dealing{
    animation:dealIn .58s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes dealIn{
    0%   {opacity:0; transform:translate(-70px,22px) rotate(-22deg) scale(.82)}
    55%  {opacity:1; transform:translate(7px,-4px) rotate(3deg) scale(1.02)}
    100% {opacity:1; transform:translate(0,0) rotate(0) scale(1)}
  }

  /* состояние сброса */
  .discard:not(.has-cards) .discard-slot{opacity:1}
  .discard.has-cards .discard-slot{opacity:0}
  .discard.has-cards .discard-edge{opacity:.95}

  .question{
    display:block;
    margin:0;
    font-family:'Neucha','Segoe Print','Comic Sans MS',cursive;
    font-weight:400;
    font-size:clamp(13px, 3.5vw, 17px);
    line-height:1.35;
    color:#15110e;
    letter-spacing:.01em;
    text-wrap:balance;
  }

  /* ---------- Подсказка ---------- */
  .hint{
    position:fixed;
    bottom:max(22px, env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    font-size:.74rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(255,255,255,.6);
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .hint.is-hidden{opacity:0}

  @media (prefers-reduced-motion:reduce){
    .current{transition:none}
    .current.is-dealing{animation:none; opacity:1; transform:none}
    .deck{transition:none}
  }
</style>
</head>
<body>

  <main class="table">

    <!-- Колода -->
    <div class="pile">
      <button class="deck" id="deck" type="button" aria-label="Тянуть карту из колоды">
        <span class="deck-card" style="--i:5" aria-hidden="true"></span>
        <span class="deck-card" style="--i:4" aria-hidden="true"></span>
        <span class="deck-card" style="--i:3" aria-hidden="true"></span>
        <span class="deck-card" style="--i:2" aria-hidden="true"></span>
        <span class="deck-card" style="--i:1" aria-hidden="true"></span>
        <span class="deck-card" style="--i:0" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Сброс -->
    <div class="pile">
      <div class="discard" id="discard" role="button" tabindex="0" aria-label="Стопка сброса">
        <span class="discard-slot" aria-hidden="true"></span>
        <span class="discard-edge" style="--i:3" aria-hidden="true"></span>
        <span class="discard-edge" style="--i:2" aria-hidden="true"></span>
        <span class="discard-edge" style="--i:1" aria-hidden="true"></span>
        <div class="current" id="currentCard">
          <span class="question" id="questionText" aria-live="polite"></span>
        </div>
      </div>
    </div>

  </main>

  <div class="hint" id="hint">Нажми на колоду</div>

<script>
(() => {
  'use strict';

  const deck        = document.getElementById('deck');
  const discard     = document.getElementById('discard');
  const currentCard = document.getElementById('currentCard');
  const questionEl  = document.getElementById('questionText');
  const hint        = document.getElementById('hint');

  const DEAL_MS = 600;

  const state = {
    questions: [],
    deck: [],
    index: 0,
    isAnimating: false,
    ready: false,
    firstDraw: true
  };

  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sentenceCase(text){
    const t = String(text).trim().toLowerCase();
    if (!t) return '';
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function resetDeck(){
    state.deck = shuffle(state.questions.slice());
    state.index = 0;
  }

  function draw(){
    if (!state.ready || state.isAnimating) return;
    state.isAnimating = true;
    setTimeout(() => { state.isAnimating = false; }, DEAL_MS);

    if (state.index >= state.deck.length) resetDeck();
    const raw = state.deck[state.index++];
    questionEl.textContent = sentenceCase(raw);

    // перезапуск анимации раздачи
    currentCard.classList.remove('is-dealing');
    void currentCard.offsetWidth;
    currentCard.classList.add('is-visible', 'is-dealing');

    discard.classList.add('has-cards');

    if (state.firstDraw){
      state.firstDraw = false;
      hint.classList.add('is-hidden');
    }
  }

  deck.addEventListener('click', draw);

  discard.addEventListener('click', () => {
    if (!state.ready) return;
    if (state.firstDraw) return;   // пустой сброс — не реагируем
    draw();
  });
  discard.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      discard.click();
    }
  });

  async function init(){
    try {
      const res = await fetch('questions.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data)
        ? data.filter(q => typeof q === 'string' && q.trim().length > 0)
        : [];
      if (!list.length) throw new Error('Пустой список вопросов');

      state.questions = list;
      resetDeck();
      state.ready = true;
    } catch (err){
      console.error('Ошибка загрузки:', err);
      questionEl.textContent = 'Не удалось загрузить вопросы';
      currentCard.classList.add('is-visible');
      hint.textContent = 'Ошибка загрузки';
    }
  }

  init();
})();
</script>
</body>
</html>
